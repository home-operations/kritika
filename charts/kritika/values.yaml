---
# Default values for kritika.
#
# Most string, list and map values below are rendered through Helm's `tpl`, so
# they may carry template expressions that resolve at install time, e.g.
#   ingress.hosts[0].host: kritika.{{ .Values.global.domain }}
# Plain numbers and booleans are passed through as they are.

image:
  # -- Image repository.
  repository: ghcr.io/home-operations/kritika
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag; defaults to the chart appVersion.
  tag: ""
  # -- Pin the image by digest (sha256:…); when set, overrides the tag. The release pipeline fills it with the published image's digest.
  digest: ""

# -- Image pull secrets for private registries, for the kritika serve pods and, through the runner ServiceAccount, runner Jobs.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release name.
fullnameOverride: ""

# kritika runs as one Deployment of `kritika serve`: webhooks, the dashboard,
# the job queues, runner Jobs, the gateway and, on the replica holding the
# leader lock, the leader duties. Runner pods are not part of it: serve
# creates them as Jobs, one per review, follow-up and index run.
# -- Replicas of kritika serve. Every replica serves webhooks and the dashboard and works jobs; exactly one holds the leader lock at a time. A rollout keeps one serving on its own; set 2 for one to keep serving while a pod or node is lost.
replicas: 1

# -- Deployment update strategy. A rolling update that surges one pod and takes none down keeps a replica serving while each is replaced. Helm merges maps, so a switch to `Recreate` also sets `rollingUpdate: null`.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# @schema
# type: object
# additionalProperties: false
# properties:
#   addr: { type: string }
#   metricsAddr: { type: string }
#   gatewayAddr: { type: string }
#   gatewayUrl: { type: string }
#   gatewayTokenTtl: { type: string, minLength: 1 }
#   gatewayCacheDir: { type: string }
#   gatewayCacheMaxSize: { type: [string, integer] }
#   gatewayCacheMaxAge: { type: string, minLength: 1 }
#   webUrl: { type: string }
#   databaseAppRole: { type: string }
#   databaseRunnerRole: { type: string }
#   leaderRetryInterval: { type: string, minLength: 1 }
#   reviewWorkers: { type: integer }
#   indexWorkers: { type: integer }
#   threadWorkers: { type: integer }
#   executor: { type: string }
#   logLevel: { type: string }
#   logFormat: { type: string }
#   pollInterval: { type: string, minLength: 1 }
#   pollLookback: { type: string, minLength: 1 }
#   onboardWindow: { type: integer }
#   indexGrace: { type: string, minLength: 1 }
#   transcriptRetention: { type: string, minLength: 1 }
#   diffRetention: { type: string, minLength: 1 }
#   auth: { type: object }
#   apps: { type: object }
#   providers: { type: object }
#   embedding: { type: object }
#   egress: { type: object }
#   repositories: { type: object }
#   accounts: { type: object }
#   runner: { type: object }
#   review: { type: object }
#   confidence: { type: object }
#   trigger: { type: object }
#   comments: { type: object }
#   agent: { type: object }
#   skills: { type: object }
#   limits: { type: object }
#   rules: { type: array }
#   context: { type: array }
#   ignore: { type: array }
#   enabled: { type: boolean }
# @schema
# -- Application configuration, using the same YAML schema as config.yaml. Secrets are references such as { env: ADMIN_PASSWORD }, supplied through env or envFrom. Omitted settings use application defaults. Rendered through tpl with the release context. Mutually exclusive with existingConfigMap.
config: {}
# webUrl: https://kritika.example.com
# auth:
#   admin:
#     password: { env: ADMIN_PASSWORD }
# apps:
#   github:
#     accounts: [org-1]
#     clientId: Iv1.example
#     privateKey: { env: GITHUB_APP_PRIVATE_KEY }
#     webhookSecret: { env: GITHUB_APP_WEBHOOK_SECRET }
# providers:
#   openrouter: { type: openrouter, apiKey: { env: OPENROUTER_API_KEY } }
# review:
#   model: openrouter/vendor/large-model

# -- Existing ConfigMap containing config.yaml instead of inline config. Put webUrl in that file. Changes require a restart, for example through a Reloader annotation.
existingConfigMap: ""

# -- Operational settings and referenced secrets, keyed by environment variable name. Use valueFrom.secretKeyRef for credentials. Do not duplicate file settings or chart-managed variables. Rendered through tpl.
env: {}
# ADMIN_PASSWORD:
#   valueFrom:
#     secretKeyRef: { name: kritika-auth, key: password }

# -- Secrets and ConfigMaps loaded as environment variables in bulk. Keys must match the secret references in config. Application settings must not also be set in the file.
envFrom: []

# Three Postgres connection strings, each from its own Secret. The
# application role must not own the tables (row-level security), the owner
# role runs migrations and applies configuration on the leader, and the
# runner role is handed to runner Jobs and can only write its own run. On
# CloudNativePG, declare `app` and `runner` as DatabaseRole resources and
# use the bootstrap owner as `owner`; see the database docs.
database:
  app:
    # -- (required) Secret holding the application role's connection URI.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the application role, asserted at startup (not superuser, no BYPASSRLS, owns nothing).
    role: kritika_app
  owner:
    # -- (required) Secret holding the owner role's connection URI, used only by the leader for migrations and configuration sync.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
  runner:
    # -- (required) Secret holding the runner role's connection URI; referenced by runner Jobs, never read by kritika serve.
    existingSecret: ""
    # -- Key in that Secret.
    key: uri
    # -- Name of the runner role, granted only what runner Jobs need.
    role: kritika_runner

# Runner Jobs: one pod per review, follow-up or index run, created by kritika
# serve in the release namespace from the release's -tools image, running as a
# service account with no permissions and a database role that can only touch
# its own run. The server's Role reaches every Secret in the release namespace,
# so install kritika into a namespace of its own. Their deadline and
# RuntimeClass are `runner.deadline` and `runner.runtimeClass`; a
# sandboxed RuntimeClass (gVisor, Kata) is advised, since a runner parses
# untrusted repository content and runs what the model asks.
runner:
  # -- RuntimeClass for runner Jobs, such as gvisor or kata. Empty uses the cluster default.
  runtimeClass: ""
  # -- Maximum duration of a runner Job; omitted uses the application's default of 15m.
  deadline: ""
  # Image for runner Jobs: the release's `-tools` image, which adds mise
  # with curl, fd, gh, jq, rg and yq for a review's or follow-up's run tool.
  image:
    # -- Runner image repository.
    repository: ghcr.io/home-operations/kritika
    # -- Runner image pull policy (KRITIKA_RUNNER_IMAGE_PULL_POLICY).
    pullPolicy: IfNotPresent
    # -- Overrides the runner image tag; defaults to the chart appVersion with `-tools` appended.
    tag: ""
    # -- Pin the runner image by digest (sha256:…); when set, overrides the tag. The release pipeline fills it with the published `-tools` image's digest.
    digest: ""
  # -- How long a finished Job stays for kubectl before Kubernetes removes it (Go duration); the run row keeps everything the Job knew.
  ttl: 10m
  # -- Resources for runner pods (KRITIKA_RUNNER_RESOURCES), copied into the pod spec.
  resources: {}
  # The runner image declares curl, fd, gh, jq, rg and yq; a repository adds
  # tools for its own reviews in `.kritika/mise.toml`, pinned by its lock.
  mise:
    # @schema
    # type: array
    # items:
    #   type: object
    #   additionalProperties: false
    #   required: [from, to]
    #   properties:
    #     from: { type: string, minLength: 1 }
    #     to: { type: string, minLength: 1 }
    # @schema
    # -- Rewrites of the URLs runner tools download from (KRITIKA_RUNNER_MISE_URL_REPLACEMENTS), such as to a caching mirror: mise's `url_replacements`, tried in order until one matches. `from` is a URL prefix, or `regex:` and a pattern whose groups `to` may name as `$1`. The mirror's host must pass the egress gateway; a download is still checked against the repository's lock.
    urlReplacements: []
  serviceAccount:
    # -- Create the runner ServiceAccount: no permissions, no token mounted, and the chart's `imagePullSecrets` so runner Jobs can pull from a private registry.
    create: true
    # -- Runner ServiceAccount name; generated from the release name if empty.
    name: ""
    # -- Annotations for the runner ServiceAccount.
    annotations: {}

# The gateway's download cache: each kritika serve replica keeps what runner
# tools download from the hosts `config.egress.cache` names, in an emptyDir,
# and serves it again to the next run that asks for the same URL, so a tool
# is fetched once per replica rather than once per run. mise still checks
# every download against the repository's lock.
gatewayCache:
  # -- Give each replica an emptyDir for the cache (KRITIKA_GATEWAY_CACHE_DIR); `config.egress.cache` names the hosts whose downloads it keeps.
  enabled: false
  # -- The most the cache keeps (KRITIKA_GATEWAY_CACHE_MAX_SIZE), in bytes or with Ki, Mi, Gi or Ti, the least recently used downloads going first, and apart from that the most its fetches under way may write, so leave the pod's ephemeral storage room for twice it.
  maxSize: 2Gi
  # -- How long a kept download is served before it is fetched again (KRITIKA_GATEWAY_CACHE_MAX_AGE), a Go duration.
  maxAge: 24h

serviceAccount:
  # -- Create the ServiceAccount kritika serve runs as.
  create: true
  # -- Automount the API token, which kritika serve needs to create runner Jobs.
  automount: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name; generated from the release name if empty.
  name: ""

rbac:
  # -- Create the Role and RoleBinding kritika serve needs: Jobs in the release namespace, their pods and logs, and the Secrets it hands them. Nothing cluster-wide.
  create: true

# -- Annotations added to the Deployment (e.g. `reloader.stakater.com/auto: "true"`). Pod-level annotations go in `podAnnotations`.
deploymentAnnotations: {}
# -- Annotations added to the pods.
podAnnotations: {}
# -- Labels added to the pods.
podLabels: {}

# -- Pod-level securityContext (non-root uid/gid 65532, RuntimeDefault seccomp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container securityContext (no privilege escalation, read-only root filesystem, drops ALL capabilities).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type of the public Service.
  type: ClusterIP
  # -- Public port: the webhooks (`POST /hooks/{app}`) and the dashboard.
  port: 8080
  # -- Metrics and probe port.
  metricsPort: 8081
  # -- Port of the gateway the kritika serve pods run, on the pods and its Service: the forward proxy runner Jobs are handed as `HTTPS_PROXY`, allowing only the hosts the configuration names (github.com once an app is configured, `egress.allow` less `egress.deny`), so runner pods need no direct internet egress, and the model and similar-code endpoints a runner calls with a per-run token, so no provider key enters a runner pod.
  gatewayPort: 8082

# One Ingress, or one Gateway API HTTPRoute, to the public Service, which
# serves the webhooks under `/hooks` and the dashboard. Its host must be
# `config.webUrl`'s: GitHub delivers webhooks to that URL and sign-in
# redirects back to it, so a route for another name serves a dashboard
# that cannot sign in.
ingress:
  # -- Expose the public Service through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Ingress hosts and their paths; the host is `config.webUrl`'s.
  hosts:
    - host: kritika.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration.
  tls: []
  # - secretName: kritika-tls
  #   hosts:
  #     - kritika.example.com

# Gateway API HTTPRoute, an alternative to `ingress`; one route to the public
# Service. Named `httpRoute`, not `route`, to keep clear of the OpenShift
# Route kind.
httpRoute:
  # -- Expose the public Service through a Gateway API HTTPRoute (alternative to ingress).
  enabled: false
  # -- HTTPRoute apiVersion; empty defaults to gateway.networking.k8s.io/v1.
  apiVersion: ""
  # -- HTTPRoute kind; empty defaults to HTTPRoute.
  kind: ""
  # -- HTTPRoute annotations.
  annotations: {}
  # -- HTTPRoute labels.
  labels: {}
  # -- Gateways (and listeners) this route attaches to.
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway
  #    sectionName: https

  # -- Hostnames matched against the Host header; `config.webUrl`'s host (templated).
  hostnames: []
  #  - kritika.example.com

  # -- Custom rules prepended before the default rule (templated).
  additionalRules: []
  # -- Filters applied to the default rule.
  filters: []
  # -- Match conditions for the default rule.
  matches:
    - path:
        type: PathPrefix
        value: /
  # Redirect HTTP to HTTPS (301) instead of routing to the backend. Requires
  # a Gateway with both HTTP and HTTPS listeners; matches/filters are ignored.

  # -- Redirect HTTP to HTTPS (301) instead of routing to the backend (needs HTTP+HTTPS listeners).
  httpsRedirect: false

# NetworkPolicies (off by default): one for the service pods (ingress to the
# webhook and metrics ports, and to the gateway port from runner pods;
# egress to DNS, the forges and models over the egress ports, Postgres and
# the API server) and one for runner pods (egress only: DNS, Postgres and
# the gateway port on the service pods, through which everything else is
# reached). The Postgres port is allowed to any peer because the database
# may live in another namespace.
networkPolicy:
  # -- Create the NetworkPolicies.
  enabled: false
  # -- Policy flavor for your CNI: "default" (networking.k8s.io/v1 NetworkPolicy), "cilium" (CiliumNetworkPolicy) or "calico" (projectcalico.org/v3 NetworkPolicy).
  type: default
  # -- Allow DNS egress (UDP/TCP 53); the Cilium flavor allows it to kube-dns alone.
  allowDNS: true
  # -- TCP ports the service pods may egress to for forges and model endpoints. Runner pods reach the gateway alone.
  egressPorts:
    - 443
  # -- Postgres port allowed for egress.
  postgresPort: 5432

# -- Resource requests and limits of the kritika serve pods.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Spread the kritika serve pods across nodes, so with `replicas: 2` a node loss takes one of them: a soft constraint, so a one-node cluster still schedules them. Rendered through `tpl`; empty leaves scheduling to Kubernetes.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "kritika.name" . }}'
        app.kubernetes.io/instance: "{{ .Release.Name }}"

# -- Liveness probe, on the metrics port.
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 20
# -- Readiness probe, on the metrics port. A replica is ready once its configuration file has loaded, the database answers and it serves webhooks and the dashboard, so a rollout takes the previous pod down only once the new one can hold a delivery.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 10
# -- Startup probe, on the metrics port. The liveness and readiness probes wait until it passes, so a pod still opening its listeners is not reported unready; it allows a minute.
startupProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 2
  failureThreshold: 30

# -- Grace period for a clean shutdown: kritika serve keeps accepting webhooks, dashboard requests and model steps for 5s while traffic moves off the pod, stops taking jobs and lets running ones finish for up to 100s, then takes up to 90s to hand back the reviews it cut for a retry, and its gateway lets model steps in flight finish for up to 2m.
terminationGracePeriodSeconds: 200

monitoring:
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor for the metrics Service (requires its CRDs).
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- ServiceMonitor labels.
    labels: {}
    # -- ServiceMonitor annotations.
    annotations: {}
    # -- Prometheus metric relabelings.
    metricRelabelings: []
    # -- Prometheus relabelings.
    relabelings: []
  prometheusRule:
    # -- Create a Prometheus Operator PrometheusRule with kritika's alerts (requires its CRDs): no leader, more than one leader, a configuration the leader could not apply, configuration drift, delayed queues, unavailable queue metrics and vector-search errors.
    enabled: false
    # -- PrometheusRule labels.
    labels: {}
    # -- PrometheusRule annotations.
    annotations: {}
    # -- Extra labels on every alert rule, e.g. a routing label for Alertmanager. The rule's own `severity` wins.
    additionalRuleLabels: {}
    # -- Extra annotations on every alert rule.
    additionalRuleAnnotations: {}
    # -- How long no replica may hold the leader lock before KritikaNoLeader fires. A standby takes the lock within one leader retry interval of the database answering, and a dead leader's session is dropped by Postgres within about a minute.
    noLeaderFor: 5m
    # -- How long more than one replica may report the lock before KritikaMultipleLeaders fires. A database failover can show two for one leader retry interval.
    multipleLeadersFor: 2m
    # -- How long the leader's latest apply of the configuration may stay refused before KritikaConfigError fires.
    configErrorFor: 5m
    # -- How long a replica's configuration file may differ from the applied one before KritikaConfigDrift fires; a rollout drifts briefly until the new leader applies its file.
    configDriftFor: 15m
    # -- Oldest runnable review/followup/thread job age in seconds that triggers KritikaQueueDelayed. Index onboarding is excluded; its age remains on the dashboard.
    queueAgeSeconds: 600
    # -- How long runnable work must exceed queueAgeSeconds before warning.
    queueDelayFor: 15m
    # -- How long every scraped replica may succeed on fewer than 75% of queue snapshot reads over 5 minutes before warning.
    queueStatsUnavailableFor: 5m
    # -- How long the vector-search error ratio must exceed 10% (at least 10 non-canceled requests in 15 minutes) before warning.
    vectorSearchErrorsFor: 10m
  dashboards:
    # -- Render the Grafana dashboard ConfigMap (for the kube-prometheus-stack sidecar or grafana-operator): kritika's health, intake, reviews, model spend, runner Jobs, database pools, queue delays and vector searches, from the metrics the ServiceMonitor scrapes.
    enabled: false
    # -- Namespace for the dashboard objects; defaults to the release namespace.
    namespace: ""
    # -- Annotations added to the dashboard ConfigMap (templated).
    annotations: {}
    # -- Labels added to the dashboard ConfigMap (templated).
    labels: {}
    grafanaOperator:
      # -- Render a GrafanaDashboard CR (grafana-operator) referencing the ConfigMap, instead of relying on the sidecar label.
      enabled: false
      # -- Allow a Grafana in any namespace to import this GrafanaDashboard.
      allowCrossNamespaceImport: true
      # -- Folder to create the dashboard in (templated); empty uses the Grafana default.
      folder: ""
      # -- Resync period for the operator to re-check the dashboard.
      resyncPeriod: "10m"
      # -- Label selector matching the target Grafana instance (templated; required when grafanaOperator is enabled).
      matchLabels: {}

podDisruptionBudget:
  # -- Create a PodDisruptionBudget when there is more than one replica.
  enabled: true
  # @schema
  # type: [integer, string]
  # @schema
  # -- Minimum pods that must stay available, as a count or percentage. Used unless `maxUnavailable` is set.
  minAvailable: ""
  # @schema
  # type: [integer, string]
  # @schema
  # -- Maximum pods that may be unavailable, as a count or percentage; takes precedence over `minAvailable` when set.
  maxUnavailable: 1

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}
# -- PriorityClass for the pods. Empty uses the cluster default.
priorityClassName: ""

# -- Additional volumes on the Deployment.
volumes: []
# -- Additional volume mounts on the kritika serve container.
volumeMounts: []

# Config for the chart's `helm test` hook: a one-shot pod that curls the
# metrics Service's /readyz to prove the release serves. Used only by `helm
# test`, never the workload.
tests:
  image:
    # -- `helm test` connection-pod image; a gcr-mirrored curl, so the test never pulls from Docker Hub.
    repository: mirror.gcr.io/curlimages/curl
    # -- `helm test` image, pinned as `tag@sha256:digest` so Renovate bumps the tag and its digest together.
    tag: "8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777"
    # -- `helm test` image pull policy.
    pullPolicy: IfNotPresent
