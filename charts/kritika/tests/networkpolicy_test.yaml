suite: networkPolicy
templates:
  - networkpolicy.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a policy for the service pods and one for runner pods
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress[1].ports
          content:
            port: 5432
            protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      # With the gateway, runners reach only DNS, Postgres and the gateway
      # port on gateway pods: no 443 to anywhere.
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 8082
        documentIndex: 0
      - notContains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].to[0].podSelector.matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8082
        documentIndex: 1

  - it: renders CiliumNetworkPolicies for type=cilium, with the gateway open to runner pods alone
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: cilium.io/v2
      - isKind:
          of: CiliumNetworkPolicy
      - contains:
          path: spec.ingress[0].fromEntities
          content: all
        documentIndex: 0
      - equal:
          path: spec.ingress[1].fromEndpoints[0].matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].toPorts[0].ports[0].port
          value: "8082"
        documentIndex: 0
      # DNS to kube-dns alone, then the egress ports and Postgres, then the API server.
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels["k8s-app"]
          value: kube-dns
        documentIndex: 0
      - contains:
          path: spec.egress[1].toEntities
          content: world
        documentIndex: 0
      - contains:
          path: spec.egress[1].toPorts[0].ports
          content:
            port: "5432"
            protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress[2].toEntities
          content: kube-apiserver
        documentIndex: 0
      # Runners: default deny on ingress, no 443 to the world, the gateway on the server pods.
      - equal:
          path: spec.ingress
          value:
            - {}
        documentIndex: 1
      - notContains:
          path: spec.egress[1].toPorts[0].ports
          content:
            port: "443"
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].toEndpoints[0].matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.egress[2].toPorts[0].ports[0].port
          value: "8082"
        documentIndex: 1

  - it: renders Calico NetworkPolicies for type=calico, denying runner ingress by listing it with no rules
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: projectcalico.org/v3
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.selector
          value: app.kubernetes.io/name == 'kritika' && app.kubernetes.io/instance == 'RELEASE-NAME'
        documentIndex: 0
      - equal:
          path: spec.ingress[1].source.selector
          value: kritika.home-operations.com/role == 'runner'
        documentIndex: 0
      - contains:
          path: spec.egress[2].destination.ports
          content: 5432
        documentIndex: 0
      - contains:
          path: spec.egress[3].destination.ports
          content: 6443
        documentIndex: 0
      - equal:
          path: spec.types
          value: [Ingress, Egress]
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      - notContains:
          path: spec.egress[2].destination.ports
          content: 443
        documentIndex: 1
      - equal:
          path: spec.egress[3].destination.selector
          value: app.kubernetes.io/name == 'kritika' && app.kubernetes.io/instance == 'RELEASE-NAME'
        documentIndex: 1

  - it: sends DNS to the cluster's DNS alone, from both policies
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[0]
          value:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels
          value:
            k8s-app: kube-dns
        documentIndex: 1

  - it: takes the cluster's DNS from networkPolicy.dns, its labels replacing kube-dns's
    set:
      networkPolicy.enabled: true
      networkPolicy.dns.namespace: dns
      networkPolicy.dns.podSelector:
        app.kubernetes.io/name: coredns
      networkPolicy.dns.nodeLocalAddresses: [169.254.20.10, "fd00::10"]
    asserts:
      - equal:
          path: spec.egress[0].to
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: dns
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: coredns
            - ipBlock:
                cidr: 169.254.20.10/32
            - ipBlock:
                cidr: fd00::10/128
        documentIndex: 1

  - it: leaves DNS out with allowDNS false
    set:
      networkPolicy.enabled: true
      networkPolicy.allowDNS: false
    asserts:
      - notContains:
          path: spec.egress[0].ports
          content:
            port: 53
            protocol: UDP
        documentIndex: 1
      - equal:
          path: spec.egress[0].ports
          value:
            - port: 5432
              protocol: TCP
        documentIndex: 1

  - it: on Cilium, lets runner pods look up only the cluster's Services and runnerNames
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      networkPolicy.dns.podSelector:
        "yes": resolver
      networkPolicy.dns.nodeLocalAddresses: [169.254.20.10]
      networkPolicy.dns.runnerNames: [db.example.com, "*.db.example.com"]
    asserts:
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels
          value:
            k8s:io.kubernetes.pod.namespace: kube-system
            "yes": resolver
        documentIndex: 1
      - equal:
          path: spec.egress[0].toPorts[0].rules.dns
          value:
            - matchPattern: "*.*.svc.cluster.local"
            - matchName: db.example.com
            - matchPattern: "*.db.example.com"
        documentIndex: 1
      # A NodeLocal DNSCache on the node has the host's identity.
      - equal:
          path: spec.egress[1].toEntities
          value: [host]
        documentIndex: 1
      - equal:
          path: spec.egress[1].toPorts[0].rules.dns[0].matchPattern
          value: "*.*.svc.cluster.local"
        documentIndex: 1
      # The service pods look up any name, at the same DNS.
      - notExists:
          path: spec.egress[0].toPorts[0].rules
        documentIndex: 0
      - equal:
          path: spec.egress[1].toEntities
          value: [host]
        documentIndex: 0

  - it: on Calico, sends DNS to the cluster's DNS by selector and to each node-local address by nets
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
      networkPolicy.dns.nodeLocalAddresses: [169.254.20.10, "fd00::10"]
    asserts:
      - equal:
          path: spec.egress[0]
          value:
            action: Allow
            protocol: UDP
            destination:
              namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
              selector: k8s-app == 'kube-dns'
              ports:
                - 53
        documentIndex: 1
      # One rule an address, as a rule's nets may not mix IPv4 and IPv6.
      - equal:
          path: spec.egress[1].destination.nets
          value: [169.254.20.10/32]
        documentIndex: 1
      - equal:
          path: spec.egress[2].destination.nets
          value: ["fd00::10/128"]
        documentIndex: 1
      - equal:
          path: spec.egress[3].protocol
          value: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[5].destination.nets
          value: ["fd00::10/128"]
        documentIndex: 1

  - it: lets runner pods reach Postgres in the release namespace alone by default
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[1]
          value:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: NAMESPACE
                podSelector:
                  matchLabels: {}
            ports:
              - port: 5432
                protocol: TCP
        documentIndex: 1
      # The service pods reach it at any address, as they do the egress ports.
      - equal:
          path: spec.egress[1]
          value:
            ports:
              - port: 443
                protocol: TCP
              - port: 5432
                protocol: TCP
        documentIndex: 0

  - it: takes where the database is from networkPolicy.postgres
    set:
      networkPolicy.enabled: true
      networkPolicy.postgres.namespace: db
      networkPolicy.postgres.podSelector:
        cnpg.io/cluster: kritika-postgres
      networkPolicy.postgres.cidrs: [192.0.2.10/32]
    asserts:
      - equal:
          path: spec.egress[1].to
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: db
              podSelector:
                matchLabels:
                  cnpg.io/cluster: kritika-postgres
            - ipBlock:
                cidr: 192.0.2.10/32
        documentIndex: 1

  - it: leaves the pods out when cidrs alone say where the database is
    set:
      networkPolicy.enabled: true
      networkPolicy.postgres.cidrs: [192.0.2.10/32]
    asserts:
      - equal:
          path: spec.egress[1].to
          value:
            - ipBlock:
                cidr: 192.0.2.10/32
        documentIndex: 1

  - it: on Cilium, lets runner pods reach Postgres at the database's pods and CIDRs
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      networkPolicy.postgres.podSelector:
        cnpg.io/cluster: kritika-postgres
      networkPolicy.postgres.cidrs: [192.0.2.10/32]
    asserts:
      - equal:
          path: spec.egress[1]
          value:
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: NAMESPACE
                  cnpg.io/cluster: kritika-postgres
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].toCIDR
          value: [192.0.2.10/32]
        documentIndex: 1
      - notContains:
          path: spec.egress
          content:
            toEntities:
              - cluster
              - world
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
        documentIndex: 1

  - it: on Calico, lets runner pods reach Postgres at the database's pods and each CIDR
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
      networkPolicy.postgres.podSelector:
        cnpg.io/cluster: kritika-postgres
      networkPolicy.postgres.cidrs: [192.0.2.10/32, "2001:db8::10/128"]
    asserts:
      - equal:
          path: spec.egress[2].destination
          value:
            namespaceSelector: kubernetes.io/metadata.name == 'NAMESPACE'
            selector: cnpg.io/cluster == 'kritika-postgres'
            ports:
              - 5432
        documentIndex: 1
      - equal:
          path: spec.egress[3].destination.nets
          value: [192.0.2.10/32]
        documentIndex: 1
      - equal:
          path: spec.egress[4].destination.nets
          value: ["2001:db8::10/128"]
        documentIndex: 1

  - it: fails fast on an unknown type
    set:
      networkPolicy.enabled: true
      networkPolicy.type: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'networkPolicy.type must be one of: default, cilium, calico (got "bogus")'

  - it: permits the S3 endpoint port for serve without granting it to runners
    set:
      networkPolicy.enabled: true
      gatewayCache:
        enabled: true
        storage:
          type: s3
          endpoint: http://garage.storage.svc:3900
          region: garage
          bucket: kritika
    asserts:
      - contains:
          path: spec.egress[1].ports
          content: { port: 3900, protocol: TCP }
        documentIndex: 0
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 5432, protocol: TCP }]
        documentIndex: 1
      - equal:
          path: spec.egress[2].ports
          value: [{ port: 8082, protocol: TCP }]
        documentIndex: 1
