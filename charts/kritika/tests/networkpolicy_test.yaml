suite: networkPolicy
templates:
  - networkpolicy.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: is rendered by default, in the default flavor on a cluster that serves no other policy API
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: networking.k8s.io/v1

  - it: auto renders the Cilium flavor on a cluster that serves CiliumNetworkPolicy
    capabilities:
      apiVersions:
        - cilium.io/v2/CiliumNetworkPolicy
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: CiliumNetworkPolicy
        documentIndex: 0
      - isKind:
          of: CiliumNetworkPolicy
        documentIndex: 1

  - it: auto renders the Calico flavor on a cluster that serves Calico's NetworkPolicy
    capabilities:
      apiVersions:
        - projectcalico.org/v3/NetworkPolicy
    asserts:
      - isAPIVersion:
          of: projectcalico.org/v3

  - it: auto prefers Cilium on a cluster that serves both
    capabilities:
      apiVersions:
        - projectcalico.org/v3/NetworkPolicy
        - cilium.io/v2/CiliumNetworkPolicy
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
        documentIndex: 0

  - it: renders the flavor set over what the cluster serves
    set:
      networkPolicy.type: default
    capabilities:
      apiVersions:
        - cilium.io/v2/CiliumNetworkPolicy
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1

  - it: is not rendered when turned off
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a policy for the service pods and one for runner pods
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: NetworkPolicy
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8080
            protocol: TCP
        documentIndex: 0
      - contains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.podSelector.matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      # With the gateway, runners reach only DNS, Postgres and the gateway
      # port on gateway pods: no 443 to anywhere.
      - equal:
          path: spec.ingress[1].from[0].podSelector.matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 8082
        documentIndex: 0
      - notContains:
          path: spec.egress[1].ports
          content:
            port: 443
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].to[0].podSelector.matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.egress[2].ports[0].port
          value: 8082
        documentIndex: 1

  - it: renders CiliumNetworkPolicies for type=cilium, with the gateway open to runner pods alone
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
    asserts:
      - hasDocuments:
          count: 3
      - isAPIVersion:
          of: cilium.io/v2
        documentIndex: 0
      - isKind:
          of: CiliumNetworkPolicy
        documentIndex: 0
      - isAPIVersion:
          of: cilium.io/v2
        documentIndex: 1
      - isKind:
          of: CiliumNetworkPolicy
        documentIndex: 1
      - contains:
          path: spec.ingress[0].fromEntities
          content: all
        documentIndex: 0
      - equal:
          path: spec.ingress[1].fromEndpoints[0].matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 0
      - equal:
          path: spec.ingress[1].toPorts[0].ports[0].port
          value: "8082"
        documentIndex: 0
      # DNS to kube-dns alone, then the egress ports, then Postgres's pods, then the API server.
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels["k8s-app"]
          value: kube-dns
        documentIndex: 0
      - contains:
          path: spec.egress[1].toEntities
          content: world
        documentIndex: 0
      - equal:
          path: spec.egress[1].toPorts[0].ports
          value: [{ port: "443", protocol: TCP }]
        documentIndex: 0
      - equal:
          path: spec.egress[2].toPorts[0].ports
          value: [{ port: "5432", protocol: TCP }]
        documentIndex: 0
      - contains:
          path: spec.egress[3].toEntities
          content: kube-apiserver
        documentIndex: 0
      # Runners: default deny on ingress, no 443 to the world, the gateway on the server pods.
      - equal:
          path: spec.ingress
          value:
            - {}
        documentIndex: 1
      - notContains:
          path: spec.egress[1].toPorts[0].ports
          content:
            port: "443"
            protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[2].toEndpoints[0].matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 1
      - equal:
          path: spec.egress[2].toPorts[0].ports[0].port
          value: "8082"
        documentIndex: 1

  - it: on Cilium, also keeps runner pods to the database and the gateway without DNS, should Cilium refuse its DNS rules
    set:
      networkPolicy.type: cilium
    asserts:
      - isAPIVersion:
          of: networking.k8s.io/v1
        documentIndex: 2
      - equal:
          path: spec.podSelector.matchLabels["kritika.home-operations.com/role"]
          value: runner
        documentIndex: 2
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
        documentIndex: 2
      - lengthEqual:
          path: spec.egress
          count: 2
        documentIndex: 2
      - equal:
          path: spec.egress[0].ports
          value: [{ port: 5432, protocol: TCP }]
        documentIndex: 2
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 8082, protocol: TCP }]
        documentIndex: 2

  - it: renders Calico NetworkPolicies for type=calico, denying runner ingress by listing it with no rules
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
    asserts:
      - hasDocuments:
          count: 2
      - isAPIVersion:
          of: projectcalico.org/v3
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.selector
          value: app.kubernetes.io/name == 'kritika' && app.kubernetes.io/instance == 'RELEASE-NAME'
        documentIndex: 0
      - equal:
          path: spec.ingress[1].source.selector
          value: kritika.home-operations.com/role == 'runner'
        documentIndex: 0
      - equal:
          path: spec.egress[2].destination.ports
          value: [443]
        documentIndex: 0
      - equal:
          path: spec.egress[3].destination.ports
          value: [5432]
        documentIndex: 0
      - contains:
          path: spec.egress[4].destination.ports
          content: 6443
        documentIndex: 0
      - equal:
          path: spec.types
          value: [Ingress, Egress]
        documentIndex: 1
      - notExists:
          path: spec.ingress
        documentIndex: 1
      - notContains:
          path: spec.egress[2].destination.ports
          content: 443
        documentIndex: 1
      - equal:
          path: spec.egress[3].destination.selector
          value: app.kubernetes.io/name == 'kritika' && app.kubernetes.io/instance == 'RELEASE-NAME'
        documentIndex: 1

  - it: sends DNS to the cluster's DNS alone, from both policies
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[0]
          value:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels
          value:
            k8s-app: kube-dns
        documentIndex: 1

  - it: takes the cluster's DNS from networkPolicy.dns, its labels replacing kube-dns's
    set:
      networkPolicy.enabled: true
      networkPolicy.dns.namespace: dns
      networkPolicy.dns.podSelector:
        app.kubernetes.io/name: coredns
      networkPolicy.dns.nodeLocalAddresses: [169.254.20.10, "fd00::10"]
    asserts:
      - equal:
          path: spec.egress[0].to
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: dns
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: coredns
            - ipBlock:
                cidr: 169.254.20.10/32
            - ipBlock:
                cidr: fd00::10/128
        documentIndex: 1

  - it: on Cilium, lets runner pods look up only the cluster's Services
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      networkPolicy.dns.podSelector:
        "yes": resolver
      networkPolicy.dns.nodeLocalAddresses: [169.254.20.10]
    asserts:
      - equal:
          path: spec.egress[0].toEndpoints[0].matchLabels
          value:
            k8s:io.kubernetes.pod.namespace: kube-system
            "yes": resolver
        documentIndex: 1
      - equal:
          path: spec.egress[0].toPorts[0].rules.dns
          value:
            - matchPattern: "*.*.svc.cluster.local"
        documentIndex: 1
      # A NodeLocal DNSCache on the node has the host's identity.
      - equal:
          path: spec.egress[1].toEntities
          value: [host]
        documentIndex: 1
      - equal:
          path: spec.egress[1].toPorts[0].rules.dns[0].matchPattern
          value: "*.*.svc.cluster.local"
        documentIndex: 1
      # The service pods look up any name, at the same DNS.
      - notExists:
          path: spec.egress[0].toPorts[0].rules
        documentIndex: 0
      - equal:
          path: spec.egress[1].toEntities
          value: [host]
        documentIndex: 0

  - it: on Cilium, lets runner pods look up the Services of the cluster's DNS domain
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      clusterDomain: newcluster.local
    asserts:
      - equal:
          path: spec.egress[0].toPorts[0].rules.dns
          value:
            - matchPattern: "*.*.svc.newcluster.local"
        documentIndex: 1

  - it: on Cilium, lets runner pods look up Services in a single-label cluster DNS domain
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      clusterDomain: local
    asserts:
      - equal:
          path: spec.egress[0].toPorts[0].rules.dns
          value:
            - matchPattern: "*.*.svc.local"
        documentIndex: 1

  - it: on Calico, sends DNS to the cluster's DNS by selector and to each node-local address by nets
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
      networkPolicy.dns.nodeLocalAddresses: [169.254.20.10, "fd00::10"]
    asserts:
      - equal:
          path: spec.egress[0]
          value:
            action: Allow
            protocol: UDP
            destination:
              namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
              selector: k8s-app == 'kube-dns'
              ports:
                - 53
        documentIndex: 1
      # One rule an address, as a rule's nets may not mix IPv4 and IPv6.
      - equal:
          path: spec.egress[1].destination.nets
          value: [169.254.20.10/32]
        documentIndex: 1
      - equal:
          path: spec.egress[2].destination.nets
          value: ["fd00::10/128"]
        documentIndex: 1
      - equal:
          path: spec.egress[3].protocol
          value: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[5].destination.nets
          value: ["fd00::10/128"]
        documentIndex: 1

  - it: lets both pods reach Postgres in the release namespace alone by default
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.egress[1]
          value:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: NAMESPACE
                podSelector:
                  matchLabels: {}
            ports:
              - port: 5432
                protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[1]
          value:
            ports:
              - port: 443
                protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.egress[2]
          value:
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: NAMESPACE
                podSelector:
                  matchLabels: {}
            ports:
              - port: 5432
                protocol: TCP
        documentIndex: 0

  - it: takes where the database is from networkPolicy.postgres, for both pods
    set:
      networkPolicy.enabled: true
      networkPolicy.postgres.namespace: db
      networkPolicy.postgres.podSelector:
        cnpg.io/cluster: kritika-postgres
    asserts:
      - equal:
          path: spec.egress[1].to
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: db
              podSelector:
                matchLabels:
                  cnpg.io/cluster: kritika-postgres
        documentIndex: 1
      - equal:
          path: spec.egress[2].to
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: db
              podSelector:
                matchLabels:
                  cnpg.io/cluster: kritika-postgres
        documentIndex: 0

  - it: on Cilium, lets both pods reach Postgres at the database's pods alone
    set:
      networkPolicy.enabled: true
      networkPolicy.type: cilium
      networkPolicy.postgres.podSelector:
        cnpg.io/cluster: kritika-postgres
    asserts:
      - equal:
          path: spec.egress[1]
          value:
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: NAMESPACE
                  cnpg.io/cluster: kritika-postgres
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
        documentIndex: 1
      - equal:
          path: spec.egress[1]
          value:
            toEntities:
              - cluster
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        documentIndex: 0
      - equal:
          path: spec.egress[2]
          value:
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: NAMESPACE
                  cnpg.io/cluster: kritika-postgres
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
        documentIndex: 0

  - it: on Calico, lets both pods reach Postgres at the database's pods alone
    set:
      networkPolicy.enabled: true
      networkPolicy.type: calico
      networkPolicy.postgres.podSelector:
        cnpg.io/cluster: kritika-postgres
    asserts:
      - equal:
          path: spec.egress[2].destination
          value:
            namespaceSelector: kubernetes.io/metadata.name == 'NAMESPACE'
            selector: cnpg.io/cluster == 'kritika-postgres'
            ports:
              - 5432
        documentIndex: 1
      - equal:
          path: spec.egress[2].destination
          value:
            ports:
              - 443
        documentIndex: 0
      - equal:
          path: spec.egress[3].destination
          value:
            namespaceSelector: kubernetes.io/metadata.name == 'NAMESPACE'
            selector: cnpg.io/cluster == 'kritika-postgres'
            ports:
              - 5432
        documentIndex: 0

  - it: leaves the service pods' egress port rule out when egressPorts is empty
    set:
      networkPolicy.egressPorts: []
    asserts:
      # A rule with neither ports nor a destination would allow every destination.
      - lengthEqual:
          path: spec.egress
          count: 3
        documentIndex: 0
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 5432, protocol: TCP }]
        documentIndex: 0

  - it: on Cilium, leaves the service pods' egress port rule out when egressPorts is empty
    set:
      networkPolicy.type: cilium
      networkPolicy.egressPorts: []
    asserts:
      - equal:
          path: spec.egress[1].toPorts[0].ports
          value: [{ port: "5432", protocol: TCP }]
        documentIndex: 0
      - lengthEqual:
          path: spec.egress
          count: 3
        documentIndex: 0

  - it: on Calico, leaves the service pods' egress port rule out when egressPorts is empty
    set:
      networkPolicy.type: calico
      networkPolicy.egressPorts: []
    asserts:
      - equal:
          path: spec.egress[2].destination.ports
          value: [5432]
        documentIndex: 0
      - lengthEqual:
          path: spec.egress
          count: 4
        documentIndex: 0

  - it: fails fast on an unknown type
    set:
      networkPolicy.enabled: true
      networkPolicy.type: bogus
    asserts:
      - failedTemplate:
          errorMessage: 'networkPolicy.type must be one of: auto, default, cilium, calico (got "bogus")'

  - it: takes the database's port from postgres.port, for both pods
    set:
      networkPolicy.postgres.port: 6432
    asserts:
      - equal:
          path: spec.egress[2].ports
          value: [{ port: 6432, protocol: TCP }]
        documentIndex: 0
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 6432, protocol: TCP }]
        documentIndex: 1

  # The endpoint's port is a Service's, which a NetworkPolicy does not match.
  - it: adds no port for the S3 gateway cache's endpoint
    set:
      networkPolicy.enabled: true
      gatewayCache:
        enabled: true
        storage:
          type: s3
          endpoint: http://garage.storage.svc:3900
          region: garage
          bucket: kritika
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 443, protocol: TCP }]
        documentIndex: 0
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 5432, protocol: TCP }]
        documentIndex: 1

  - it: renders extraEgress as a NetworkPolicy of its own for the service pods alone
    set:
      networkPolicy.extraEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: rook-ceph
              podSelector:
                matchLabels:
                  rook_object_store: ceph-objectstore
          ports:
            - port: 8080
              protocol: TCP
    asserts:
      - hasDocuments:
          count: 3
      - isAPIVersion:
          of: networking.k8s.io/v1
        documentIndex: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika-extra-egress
        documentIndex: 2
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME
        documentIndex: 2
      - equal:
          path: spec.policyTypes
          value: [Egress]
        documentIndex: 2
      - equal:
          path: spec.egress
          value:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: rook-ceph
                  podSelector:
                    matchLabels:
                      rook_object_store: ceph-objectstore
              ports:
                - port: 8080
                  protocol: TCP
        documentIndex: 2
      # Neither flavor policy changes.
      - equal:
          path: spec.egress[1].ports
          value: [{ port: 443, protocol: TCP }]
        documentIndex: 0
      - lengthEqual:
          path: spec.egress
          count: 3
        documentIndex: 1

  - it: renders extraEgress as a standard NetworkPolicy beside Cilium's
    set:
      networkPolicy.type: cilium
      networkPolicy.extraEgress:
        - ports:
            - port: 8080
              protocol: TCP
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: NetworkPolicy
        documentIndex: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika-extra-egress
        documentIndex: 3

  - it: renders extraEgress as a standard NetworkPolicy beside Calico's
    set:
      networkPolicy.type: calico
      networkPolicy.extraEgress:
        - ports:
            - port: 8080
              protocol: TCP
    asserts:
      - hasDocuments:
          count: 3
      - isAPIVersion:
          of: networking.k8s.io/v1
        documentIndex: 2
      - equal:
          path: spec.egress
          value: [{ ports: [{ port: 8080, protocol: TCP }] }]
        documentIndex: 2
