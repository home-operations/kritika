suite: configmap
templates:
  - configmap.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders the application configuration
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika
      - matchRegex:
          path: data["config.yaml"]
          pattern: "clientId: Iv1.example"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "env: GITHUB_APP_PRIVATE_KEY"

  - it: tells Reloader to ignore it, since the pods' checksum already rolls them
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/ignore"]
          value: "true"

  - it: renders nothing when an existing ConfigMap is named
    set:
      existingConfigMap: my-config
      config: null
    asserts:
      - hasDocuments:
          count: 0

  - it: preserves explicit zero and false values and escaped template expressions
    set:
      config.pollInterval: 0s
      config.review.approve: false
      config.confidence.threshold: 0
      config.comments.summary: '{{ "{{ .Release.Name }}" }}'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "pollInterval: 0s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "approve: false"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "threshold: 0"
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\{\{ .Release.Name \}\}'

  - it: evaluates application config with the release and values context
    set:
      config.webUrl: "https://{{ .Release.Name }}.turbo.ac"
      config.apps.github.clientId: "{{ .Release.Namespace }}-{{ .Values.service.port }}"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webUrl: https://RELEASE-NAME.turbo.ac"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "clientId: NAMESPACE-8080"

  - it: derives the runner configuration from runner values
    set:
      runner.runtimeClass: gvisor
      runner.deadline: 20m
      runner.image.repository: registry.example/tools
      runner.image.tag: custom
      runner.resources: { limits: { memory: 1Gi } }
      runner.mise.urlReplacements:
        - { from: "https://github.com/acme/", to: "https://mirror.example.com/acme/" }
        - { from: "https://github.com/", to: "https://mirror.example.com/github/" }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "runtimeClass: gvisor"
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'miseUrlReplacements:\n\s+- from: https://github.com/acme/\n\s+to: https://mirror.example.com/acme/\n\s+- from: https://github.com/\n\s+to: https://mirror.example.com/github/'
      - matchRegex:
          path: data["config.yaml"]
          pattern: "deadline: 20m"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "image: registry.example/tools:custom"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "memory: 1Gi"

  - it: omits URL replacements by default, leaving runner downloads at their URLs
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: miseUrlReplacements

  - it: refuses runner configuration duplicated in application config
    set:
      config.runner.runtimeClass: gvisor
    asserts:
      - failedTemplate:
          errorPattern: "config.runner: the chart derives this setting from its deployment values"

  - it: explains how to migrate configFile
    set:
      configFile: { review: { approve: true } }
    asserts:
      - failedTemplate:
          errorPattern: configFile has moved to config

  - it: renders the gateway cache's settings when it is enabled
    set:
      gatewayCache: { enabled: true, maxSize: 512Mi, maxAge: 6h }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gatewayCacheDir: /var/cache/kritika"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gatewayCacheMaxSize: 512Mi"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gatewayCacheMaxAge: 6h"

  - it: leaves the gateway without a cache by default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: gatewayCache

  - it: refuses a cache directory in application config when the chart gives the gateway one
    set:
      gatewayCache.enabled: true
      config.gatewayCacheDir: /elsewhere
    asserts:
      - failedTemplate:
          errorPattern: "config.gatewayCacheDir: the chart derives this setting from its deployment values"
