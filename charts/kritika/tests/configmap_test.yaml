suite: configmap
templates:
  - configmap.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders the application configuration
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika
      - matchRegex:
          path: data["config.yaml"]
          pattern: "clientId: Iv1.example"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "env: GITHUB_APP_PRIVATE_KEY"

  - it: tells Reloader to ignore it, since the pods' checksum already rolls them
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/ignore"]
          value: "true"

  - it: renders nothing when an existing ConfigMap is named
    set:
      existingConfigMap: my-config
      config: null
    asserts:
      - hasDocuments:
          count: 0

  - it: preserves explicit zero and false values and escaped template expressions
    set:
      config.pollInterval: 0s
      config.review.approve: false
      config.confidence.threshold: 0
      config.comments.summary: '{{ "{{ .Release.Name }}" }}'
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "pollInterval: 0s"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "approve: false"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "threshold: 0"
      - matchRegex:
          path: data["config.yaml"]
          pattern: '\{\{ .Release.Name \}\}'

  - it: evaluates application config with the release and values context
    set:
      config.webUrl: "https://{{ .Release.Name }}.turbo.ac"
      config.apps.github.clientId: "{{ .Release.Namespace }}-{{ .Values.service.port }}"
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "webUrl: https://RELEASE-NAME.turbo.ac"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "clientId: NAMESPACE-8080"

  - it: derives the runner configuration from runner values
    set:
      runner.jobTemplate.spec.activeDeadlineSeconds: 1200
      runner.podTemplate.spec.runtimeClassName: gvisor
      runner.podTemplate.spec.resources: { limits: { memory: 1Gi } }
      runner.podTemplate.spec.containers:
        - { name: runner, image: registry.example/tools:custom }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "activeDeadlineSeconds: 1200"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "runtimeClassName: gvisor"
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- image: registry.example/tools:custom\n\s+name: runner'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'resources:\n\s+limits:\n\s+memory: 1Gi'

  - it: fills the runner container's image with this release's -tools image
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: '- image: ghcr.io/home-operations/kritika:\d+\.\d+\.\d+-tools\n\s+imagePullPolicy: IfNotPresent\n\s+name: runner'

  - it: renders runner.podTemplate into the runner configuration, through tpl
    set:
      runner.podTemplate.metadata.labels: { release: "{{ .Release.Name }}" }
      runner.podTemplate.spec.nodeSelector: { node-role.example.com/runner: "true" }
      runner.podTemplate.spec.tolerations: [{ key: runner, operator: Exists, effect: NoSchedule }]
      runner.podTemplate.spec.hostUsers: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'labels:\n\s+release: RELEASE-NAME'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'hostUsers: false\n\s+nodeSelector:\n\s+node-role.example.com/runner: "true"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'tolerations:\n\s+- effect: NoSchedule'

  - it: refuses runner configuration duplicated in application config
    set:
      config.runner.podTemplate: { spec: { runtimeClassName: gvisor } }
    asserts:
      - failedTemplate:
          errorPattern: "config.runner: the chart derives this setting from its deployment values"

  - it: renders the gateway cache's settings when it is enabled
    set:
      gatewayCache: { enabled: true, maxSize: 512Mi, maxAge: 6h }
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gatewayCacheDir: /var/cache/kritika"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gatewayCacheMaxSize: 512Mi"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "gatewayCacheMaxAge: 6h"

  - it: leaves the gateway without a cache by default
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: gatewayCache

  - it: refuses a cache directory in application config when the chart gives the gateway one
    set:
      gatewayCache.enabled: true
      config.gatewayCacheDir: /elsewhere
    asserts:
      - failedTemplate:
          errorPattern: "config.gatewayCacheDir: the chart derives this setting from its deployment values"
