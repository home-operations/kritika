suite: deployment
templates:
  - deployment.tpl
values:
  - ../ci/lint-values.yaml
tests:
  - it: renders one Deployment of kritika serve by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_POD_TEMPLATE
          any: true
      # The pod's name and UID, for the Events kritika records on it.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].args
          value: [serve]
      # The tag floats with the release-please-stamped appVersion.
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/home-operations/kritika:\d+\.\d+\.\d+$

  - it: carries a checksum of the rendered configuration file, so a change rolls the pods
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
  - it: leaves an existing ConfigMap's restarts to the deployment, keeping pod annotations
    set:
      config: null
      existingConfigMap: kritika-config
      podAnnotations:
        example.com/owner: ops
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: ops

  - it: refuses an env key the chart sets from its other values
    set:
      env:
        KRITIKA_DATABASE_URL: postgres://elsewhere.example.com/kritika
    asserts:
      - failedTemplate:
          errorPattern: env.KRITIKA_DATABASE_URL

  - it: accepts operational env settings and explicitly referenced secrets
    set:
      config.auth.admin.password: { env: KRITIKA_AUTH_ADMIN_PASSWORD }
      env:
        KRITIKA_LOG_LEVEL: debug
        KRITIKA_AUTH_ADMIN_PASSWORD:
          valueFrom:
            secretKeyRef: { name: kritika-auth, key: password }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_LOG_LEVEL
            value: debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_AUTH_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef: { name: kritika-auth, key: password }

  - it: refuses a config key for a variable the chart derives from its other values
    set:
      config:
        addr: ":9000"
    asserts:
      - failedTemplate:
          errorPattern: "config.addr: the chart derives this setting from its deployment values"

  - it: renders no envFrom by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: gates the liveness and readiness probes on a startup probe, which can be turned off
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: renders no startup probe when it is set to null
    set:
      startupProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: wires the three database secrets and the runner settings
    set:
      config: null
      existingConfigMap: external-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: kritika-postgres-app
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_DATABASE_OWNER_URL
            valueFrom:
              secretKeyRef:
                name: kritika-postgres-credentials
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_DATABASE_SECRET
            value: kritika-postgres-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_SERVICE_ACCOUNT
            value: RELEASE-NAME-kritika-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_EXECUTOR
            value: kubernetes

  - it: mounts the config read-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/kritika
            readOnly: true

  - it: refuses to render without the owner secret
    set:
      database.owner.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: database.owner.existingSecret is required

  - it: prefers the digest over the tag when set
    set:
      image.digest: sha256:deadbeef
      image.tag: ignored
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kritika@sha256:deadbeef

  - it: runs runner Jobs on the -tools tag of the appVersion by default
    set:
      config: null
      existingConfigMap: external-config
    asserts:
      # The tag floats with the release-please-stamped appVersion.
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "KRITIKA_RUNNER_POD_TEMPLATE")].value
          pattern: '"containers":\[\{"image":"ghcr\.io/home-operations/kritika:\d+\.\d+\.\d+-tools","imagePullPolicy":"IfNotPresent","name":"runner"\}\]'

  - it: takes the runner image from the chart's image repository, not its tag or digest
    set:
      config: null
      existingConfigMap: external-config
      image.repository: registry.example/kritika
      image.tag: 1.2.3
      image.digest: sha256:deadbeef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example/kritika@sha256:deadbeef
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "KRITIKA_RUNNER_POD_TEMPLATE")].value
          pattern: '"image":"registry\.example/kritika:\d+\.\d+\.\d+-tools"'

  - it: takes the runner container's image and pull policy from runner.podTemplate
    set:
      config: null
      existingConfigMap: external-config
      runner.podTemplate.spec.containers:
        - { name: runner, image: registry.example/kritika-tools:24h, imagePullPolicy: Always }
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "KRITIKA_RUNNER_POD_TEMPLATE")].value
          pattern: '"containers":\[\{"image":"registry\.example/kritika-tools:24h","imagePullPolicy":"Always","name":"runner"\}\]'

  - it: leaves how kritika runs to its defaults unless values set it
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_POLL_INTERVAL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_TOOLS
          any: true

  - it: renders the runner templates as JSON for an external configuration
    set:
      config: null
      existingConfigMap: external-config
      runner.jobTemplate.spec.activeDeadlineSeconds: 1200
      runner.podTemplate.spec.resources: { limits: { memory: 1Gi } }
      runner.podTemplate.spec.priorityClassName: kritika-runner
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_JOB_TEMPLATE
            value: '{"metadata":{"annotations":{},"labels":{}},"spec":{"activeDeadlineSeconds":1200,"ttlSecondsAfterFinished":600}}'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "KRITIKA_RUNNER_POD_TEMPLATE")].value
          pattern: '"priorityClassName":"kritika-runner","resources":\{"limits":\{"memory":"1Gi"\}\}'

  - it: hands kritika serve the dashboard's URL, and one public port for the webhooks and the dashboard
    set:
      config.webUrl: https://dash.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 8081, protocol: TCP }
            - { name: gateway, containerPort: 8082, protocol: TCP }

  - it: hands kritika serve the gateway's in-cluster address, which it requires
    set:
      config: null
      existingConfigMap: external-config
      service.gatewayPort: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_GATEWAY_ADDR
            value: ":9090"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_GATEWAY_URL
            value: http://RELEASE-NAME-kritika-gateway.NAMESPACE.svc.cluster.local:9090

  - it: fails without config.webUrl
    set:
      config.webUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: config.webUrl is required

  - it: validates the rendered web URL
    set:
      config.webUrl: '{{ printf "https://%s.turbo.ac" .Release.Name }}'
    asserts:
      - isKind:
          of: Deployment

  - it: fails when config.webUrl is not an http(s) URL
    set:
      config.webUrl: ftp://dash.example.com
    asserts:
      - failedTemplate:
          errorPattern: config.webUrl must be an http\(s\) URL

  - it: rolls one replica at a time by default
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0
              maxSurge: 1

  - it: renders an overridden strategy, with the rolling update's fields nulled out
    set:
      strategy:
        type: Recreate
        rollingUpdate: null
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: spreads the replicas across nodes by default, resolving the selector through tpl
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME

  - it: leaves scheduling to Kubernetes when the spread is emptied
    set:
      topologySpreadConstraints: []
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: rejects removed tool mounts with migration guidance
    set:
      runner.tools: [{ name: helm, image: registry.example/helm:3 }]
    asserts:
      - failedTemplate:
          errorMessage: runner.tools has been removed; declare tools in a repository's .kritika/mise.toml instead

  - it: rejects the removed instance mise config with migration guidance
    set:
      runner.mise.config: |
        [tools]
        helm = "4.3.0"
    asserts:
      - failedTemplate:
          errorMessage: runner.mise.config has been removed; declare tools in a repository's .kritika/mise.toml instead

  - it: supplies only the config path, the pod's name and UID and database credentials before extra env
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 8
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_CONFIG_FILE, value: /etc/kritika/config.yaml }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom: { secretKeyRef: { name: kritika-auth, key: password } }

  - it: rejects inline config alongside an external ConfigMap
    set:
      existingConfigMap: external-config
    asserts:
      - failedTemplate:
          errorPattern: config and existingConfigMap are mutually exclusive

  - it: injects runner deployment settings for an external configuration
    set:
      config: null
      existingConfigMap: external-config
      runner.podTemplate.spec.runtimeClassName: gvisor
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "KRITIKA_RUNNER_POD_TEMPLATE")].value
          pattern: '"runtimeClassName":"gvisor"'
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_RUNNER_SERVICE_ACCOUNT, value: RELEASE-NAME-kritika-runner }
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap: { name: external-config }

  - it: refuses env overriding a chart-owned file setting
    set:
      env.KRITIKA_ADDR: ":9"
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_ADDR conflicts with config.addr"

  - it: refuses env duplicating an application file setting
    set:
      config.logLevel: debug
      env.KRITIKA_LOG_LEVEL: debug
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_LOG_LEVEL conflicts with config.logLevel"

  - it: refuses env duplicating a nested runner file setting
    set:
      env.KRITIKA_RUNNER_POD_TEMPLATE: "{}"
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_RUNNER_POD_TEMPLATE conflicts with config.runner.podTemplate"

  - it: gives each replica an emptyDir for the gateway's cache when it is enabled
    set:
      gatewayCache.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: gateway-cache, emptyDir: {} }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: gateway-cache, mountPath: /var/cache/kritika }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_GATEWAY_CACHE_DIR }
          any: true

  - it: mounts no cache volume by default
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content: { name: gateway-cache }
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: gateway-cache }
          any: true

  - it: hands the gateway cache's settings through the environment beside an existing ConfigMap
    set:
      config: null
      existingConfigMap: external-config
      gatewayCache: { enabled: true, maxSize: 512Mi, maxAge: 6h }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_GATEWAY_CACHE_DIR, value: /var/cache/kritika }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_GATEWAY_CACHE_MAX_SIZE, value: 512Mi }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_GATEWAY_CACHE_MAX_AGE, value: 6h }

  - it: refuses an env entry for a cache setting the file already sets
    set:
      config.gatewayCacheMaxAge: 6h
      env.KRITIKA_GATEWAY_CACHE_MAX_AGE: 1h
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_GATEWAY_CACHE_MAX_AGE conflicts with config.gatewayCacheMaxAge"
