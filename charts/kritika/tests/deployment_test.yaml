suite: deployment
templates:
  - deployment.tpl
values:
  - ../ci/lint-values.yaml
# The runner tools tests need a cluster that mounts image volumes.
capabilities:
  majorVersion: 1
  minorVersion: 33
tests:
  - it: renders one Deployment of kritika serve by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_RUNTIME_CLASS
          any: true
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kritika
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].args
          value: [serve]
      # The tag floats with the release-please-stamped appVersion.
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/home-operations/kritika:\d+\.\d+\.\d+$

  - it: carries a checksum of the rendered configuration file, so a change rolls the pods
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
  - it: leaves an existing ConfigMap's restarts to the deployment, keeping pod annotations
    set:
      config: null
      existingConfigMap: kritika-config
      podAnnotations:
        example.com/owner: ops
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/config"]
      - equal:
          path: spec.template.metadata.annotations["example.com/owner"]
          value: ops

  - it: refuses an env key the chart sets from its other values
    set:
      env:
        KRITIKA_DATABASE_URL: postgres://elsewhere.example.com/kritika
    asserts:
      - failedTemplate:
          errorPattern: env.KRITIKA_DATABASE_URL

  - it: accepts operational env settings and explicitly referenced secrets
    set:
      config.auth.admin.password: { env: KRITIKA_AUTH_ADMIN_PASSWORD }
      env:
        KRITIKA_LOG_LEVEL: debug
        KRITIKA_AUTH_ADMIN_PASSWORD:
          valueFrom:
            secretKeyRef: { name: kritika-auth, key: password }
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_LOG_LEVEL
            value: debug
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_AUTH_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef: { name: kritika-auth, key: password }

  - it: refuses a config key for a variable the chart derives from its other values
    set:
      config:
        addr: ":9000"
    asserts:
      - failedTemplate:
          errorPattern: "config.addr: the chart derives this setting from its deployment values"

  - it: renders no envFrom by default
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: gates the liveness and readiness probes on a startup probe, which can be turned off
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: renders no startup probe when it is set to null
    set:
      startupProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe

  - it: wires the three database secrets and the runner settings
    set:
      config: null
      existingConfigMap: external-config
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: kritika-postgres-app
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_DATABASE_OWNER_URL
            valueFrom:
              secretKeyRef:
                name: kritika-postgres-credentials
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_DATABASE_SECRET
            value: kritika-postgres-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_SERVICE_ACCOUNT
            value: RELEASE-NAME-kritika-runner
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_EXECUTOR
            value: kubernetes

  - it: mounts the config read-only
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /etc/kritika
            readOnly: true

  - it: refuses to render without the owner secret
    set:
      database.owner.existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: database.owner.existingSecret is required

  - it: prefers the digest over the tag when set
    set:
      image.digest: sha256:deadbeef
      image.tag: ignored
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kritika@sha256:deadbeef

  - it: runs runner Jobs on the -tools tag of the appVersion by default
    set:
      config: null
      existingConfigMap: external-config
    asserts:
      # The tag floats with the release-please-stamped appVersion.
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name == "KRITIKA_RUNNER_IMAGE")].value
          pattern: ^ghcr\.io/home-operations/kritika:\d+\.\d+\.\d+-tools$
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_IMAGE_PULL_POLICY
            value: IfNotPresent

  - it: takes the runner repository, tag and pull policy apart from the chart's image
    set:
      config: null
      existingConfigMap: external-config
      image.tag: 1.2.3
      runner.image.repository: registry.example/kritika-tools
      runner.image.tag: 24h
      runner.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kritika:1.2.3
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_IMAGE
            value: registry.example/kritika-tools:24h
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_IMAGE_PULL_POLICY
            value: Always

  - it: pins the runner image by its own digest
    set:
      config: null
      existingConfigMap: external-config
      image.digest: sha256:deadbeef
      runner.image.digest: sha256:cafef00d
      runner.image.tag: ignored
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/home-operations/kritika@sha256:deadbeef
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_IMAGE
            value: ghcr.io/home-operations/kritika@sha256:cafef00d

  - it: leaves how kritika runs to its defaults unless values set it
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_POLL_INTERVAL
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_RUNNER_TOOLS
          any: true

  - it: renders the runner pods' resources and tools as JSON
    set:
      config: null
      existingConfigMap: external-config
      runner.resources: { limits: { memory: 1Gi } }
      runner.tools: [{ name: helm, image: registry.example/helm:3 }]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_RUNNER_RESOURCES, value: '{"limits":{"memory":"1Gi"}}' }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            {
              name: KRITIKA_RUNNER_TOOLS,
              value: '[{"image":"registry.example/helm:3","name":"helm"}]',
            }

  - it: hands kritika serve the dashboard's URL, and one public port for the webhooks and the dashboard
    set:
      config.webUrl: https://dash.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - { name: http, containerPort: 8080, protocol: TCP }
            - { name: metrics, containerPort: 8081, protocol: TCP }
            - { name: gateway, containerPort: 8082, protocol: TCP }

  - it: hands kritika serve the gateway's in-cluster address, which it requires
    set:
      config: null
      existingConfigMap: external-config
      service.gatewayPort: 9090
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_GATEWAY_ADDR
            value: ":9090"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KRITIKA_GATEWAY_URL
            value: http://RELEASE-NAME-kritika-gateway.NAMESPACE.svc.cluster.local:9090

  - it: fails without config.webUrl
    set:
      config.webUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: config.webUrl is required

  - it: validates the rendered web URL
    set:
      config.webUrl: '{{ printf "https://%s.turbo.ac" .Release.Name }}'
    asserts:
      - isKind:
          of: Deployment

  - it: fails when config.webUrl is not an http(s) URL
    set:
      config.webUrl: ftp://dash.example.com
    asserts:
      - failedTemplate:
          errorPattern: config.webUrl must be an http\(s\) URL

  - it: rolls one replica at a time by default
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 0
              maxSurge: 1

  - it: renders an overridden strategy, with the rolling update's fields nulled out
    set:
      strategy:
        type: Recreate
        rollingUpdate: null
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: spreads the replicas across nodes by default, resolving the selector through tpl
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: RELEASE-NAME

  - it: leaves scheduling to Kubernetes when the spread is emptied
    set:
      topologySpreadConstraints: []
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: refuses runner tools on a cluster older than 1.33, which cannot mount them
    set:
      runner.tools: [{ name: helm, image: registry.example/helm:3 }]
    capabilities:
      majorVersion: 1
      minorVersion: 32
    asserts:
      - failedTemplate:
          errorPattern: runner.tools needs Kubernetes 1.33 or newer

  - it: renders runner tools on a cluster that mounts image volumes
    set:
      config: null
      existingConfigMap: external-config
      runner.tools: [{ name: helm, image: registry.example/helm:3 }]
    capabilities:
      majorVersion: 1
      minorVersion: 33
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            {
              name: KRITIKA_RUNNER_TOOLS,
              value: '[{"image":"registry.example/helm:3","name":"helm"}]',
            }

  - it: supplies only the config path and database credentials before extra env
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].env
          count: 6
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_CONFIG_FILE, value: /etc/kritika/config.yaml }
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ADMIN_PASSWORD
            valueFrom: { secretKeyRef: { name: kritika-auth, key: password } }

  - it: rejects inline config alongside an external ConfigMap
    set:
      existingConfigMap: external-config
    asserts:
      - failedTemplate:
          errorPattern: config and existingConfigMap are mutually exclusive

  - it: injects runner deployment settings for an external configuration
    set:
      config: null
      existingConfigMap: external-config
      runner.runtimeClass: gvisor
      runner.deadline: 20m
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_RUNNER_RUNTIME_CLASS, value: gvisor }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: KRITIKA_RUNNER_DEADLINE, value: 20m }
      - contains:
          path: spec.template.spec.volumes
          content:
            name: config
            configMap: { name: external-config }

  - it: refuses env overriding a chart-owned file setting
    set:
      env.KRITIKA_ADDR: ":9"
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_ADDR conflicts with config.addr"

  - it: refuses env duplicating an application file setting
    set:
      config.logLevel: debug
      env.KRITIKA_LOG_LEVEL: debug
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_LOG_LEVEL conflicts with config.logLevel"

  - it: refuses env duplicating a nested runner file setting
    set:
      env.KRITIKA_RUNNER_IMAGE: example.com/other:test
    asserts:
      - failedTemplate:
          errorPattern: "env.KRITIKA_RUNNER_IMAGE conflicts with config.runner.image"
