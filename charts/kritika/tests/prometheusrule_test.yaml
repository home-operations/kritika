suite: prometheusrule
templates:
  - prometheusrule.tpl
values:
  - ../ci/lint-values.yaml
release:
  name: kritika
  namespace: kritika
tests:
  - it: renders none by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the leader, config, queue, vector and cache groups when enabled
    set:
      monitoring.prometheusRule.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - equal:
          path: metadata.name
          value: kritika
      - equal:
          path: metadata.namespace
          value: kritika
      - lengthEqual:
          path: spec.groups
          count: 5
      - equal:
          path: spec.groups[0].name
          value: kritika.leader
      - equal:
          path: spec.groups[0].rules[0].alert
          value: KritikaNoLeader
      - equal:
          path: spec.groups[0].rules[0].expr
          value: sum by (namespace, job) (kritika_leader) == 0
      - equal:
          path: spec.groups[0].rules[0].for
          value: 5m
      - equal:
          path: spec.groups[0].rules[0].labels.severity
          value: critical
      - equal:
          path: spec.groups[0].rules[1].alert
          value: KritikaMultipleLeaders
      - equal:
          path: spec.groups[0].rules[1].expr
          value: sum by (namespace, job) (last_over_time(kritika_leader[1m])) > 1
      - equal:
          path: spec.groups[0].rules[1].for
          value: 2m
      - equal:
          path: spec.groups[1].name
          value: kritika.config
      - equal:
          path: spec.groups[1].rules[0].alert
          value: KritikaConfigError
      - equal:
          path: spec.groups[1].rules[0].labels.severity
          value: warning
      - equal:
          path: spec.groups[1].rules[1].alert
          value: KritikaConfigDrift
      - equal:
          path: spec.groups[1].rules[1].for
          value: 15m
      - matchRegex:
          path: spec.groups[0].rules[0].annotations.summary
          pattern: '\{\{ \$labels.namespace \}\} has no leader'

  - it: puts the extra labels and annotations on every rule, with severity winning
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.labels: { release: kube-prometheus-stack }
      monitoring.prometheusRule.annotations: { team: platform }
      monitoring.prometheusRule.additionalRuleLabels: { severity: info, cluster: home }
      monitoring.prometheusRule.additionalRuleAnnotations:
        { runbook_url: https://example.com/kritika }
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: metadata.annotations.team
          value: platform
      - equal:
          path: spec.groups[0].rules[0].labels
          value: { severity: critical, cluster: home }
      - equal:
          path: spec.groups[1].rules[1].labels
          value: { severity: warning, cluster: home }
      - equal:
          path: spec.groups[1].rules[0].annotations.runbook_url
          value: https://example.com/kritika

  - it: takes the wait periods from values
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.noLeaderFor: 10m
      monitoring.prometheusRule.multipleLeadersFor: 1m
      monitoring.prometheusRule.configErrorFor: 1h
      monitoring.prometheusRule.configDriftFor: 30m
    asserts:
      - equal:
          path: spec.groups[0].rules[0].for
          value: 10m
      - equal:
          path: spec.groups[0].rules[1].for
          value: 1m
      - equal:
          path: spec.groups[1].rules[0].for
          value: 1h
      - equal:
          path: spec.groups[1].rules[1].for
          value: 30m

  - it: renders shared queue aggregation and search errors with custom thresholds
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.queueAgeSeconds: 900
      monitoring.prometheusRule.queueDelayFor: 20m
      monitoring.prometheusRule.queueStatsUnavailableFor: 3m
      monitoring.prometheusRule.vectorSearchErrorsFor: 5m
      monitoring.prometheusRule.additionalRuleLabels: { team: platform }
      monitoring.prometheusRule.additionalRuleAnnotations:
        { runbook_url: https://example.com/queues }
    asserts:
      - equal:
          path: spec.groups[2].rules[0].expr
          value: max by (namespace, job, queue) (last_over_time(kritika_queue_oldest_runnable_seconds{queue!="index"}[5m])) > 900
      - equal:
          path: spec.groups[2].rules[0].for
          value: 20m
      - equal:
          path: spec.groups[2].rules[1].expr
          value: max by (namespace, job) (avg_over_time(kritika_queue_stats_up[5m])) < 0.75
      - equal:
          path: spec.groups[2].rules[1].for
          value: 3m
      - equal:
          path: spec.groups[3].rules[0].alert
          value: KritikaVectorSearchErrors
      - equal:
          path: spec.groups[3].rules[0].for
          value: 5m
      - equal:
          path: spec.groups[3].rules[0].labels
          value: { severity: warning, team: platform }
      - equal:
          path: spec.groups[3].rules[0].annotations.runbook_url
          value: https://example.com/queues

  - it: alerts on sustained S3 failures without treating cold misses as errors
    set:
      monitoring.prometheusRule.enabled: true
      monitoring.prometheusRule.cacheStorageErrorsFor: 5m
      monitoring.prometheusRule.additionalRuleLabels: { team: platform }
      monitoring.prometheusRule.additionalRuleAnnotations:
        { runbook_url: https://example.com/cache }
    asserts:
      - equal:
          path: spec.groups[4].rules[0].alert
          value: KritikaCacheStorageErrors
      - equal:
          path: spec.groups[4].rules[0].for
          value: 5m
      - equal:
          path: spec.groups[4].rules[0].labels
          value: { severity: warning, team: platform }
      - equal:
          path: spec.groups[4].rules[0].annotations.runbook_url
          value: https://example.com/cache
      - matchRegex:
          path: spec.groups[4].rules[0].expr
          pattern: 'outcome="error"'
      - matchRegex:
          path: spec.groups[4].rules[0].expr
          pattern: 'outcome!="canceled"'
      - matchRegex:
          path: spec.groups[4].rules[0].expr
          pattern: ">= 10"
