---
apiVersion: v2
name: kritika
description: Self-hosted AI pull request reviewer for GitHub, backed by Postgres and per-review Kubernetes Jobs
type: application
# Floor matching the chart's surface: restricted Pod Security (seccompProfile),
# batch/v1 Job TTL, networking.k8s.io/v1 NetworkPolicy, the Gateway API v1, the
# pod failure policy and pod disruption conditions runner Jobs rely on to tell
# a disrupted pod, both GA in 1.31, and the pod-level resources runner pods
# take, on by default from 1.34.
kubeVersion: ">=1.34.0-0"
# Stamped by release-please on every release so a git-sourced install deploys a
# real image tag (the release workflow re-stamps both at package time anyway;
# these keep the repo copy from going stale).
version: 0.0.105 # x-release-please-version
appVersion: "0.0.105" # x-release-please-version
home: https://github.com/home-operations/kritika
sources:
  - https://github.com/home-operations/kritika
maintainers:
  - name: home-operations
    email: contact@home-operations.com
keywords:
  - code-review
  - pull-request
  - github
  - llm
  - kubernetes
annotations:
  category: Infrastructure
  # The digest of this release's -tools image, which runner pods run unless
  # runner.podTemplate names another image. The release workflow fills it in.
  kritika.home-operations.com/runner-image-digest: ""
