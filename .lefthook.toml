[[remotes]]
git_url = "https://github.com/home-operations/.github"
ref = "main"
configs = ["lefthook.common.toml"]

# Regenerate the chart's committed README and values.schema.json whenever
# their inputs change, and stage them. CI's generate-check is the backstop.
[pre-commit.commands.helm-docs]
glob = [
  "charts/kritika/Chart.yaml",
  "charts/kritika/values.yaml",
  "charts/kritika/README.md.gotmpl",
]
run = "mise run generate && git add charts/kritika/README.md charts/kritika/values.schema.json"

# The generated chart README and schema and the authored MkDocs site under
# docs/, the published .kritika.yaml schema among it, are .prettierignore'd.
# The shared hooks pass staged paths explicitly, so a commit whose only
# Markdown or JSON is ignored hands oxfmt an empty target set, and it exits
# non-zero ("Expected at least one target file"), failing the whole hook.
# Lefthook merges this file first and the remotes over it, so a key the
# shared command sets cannot be changed here: format-json's run and exclude
# stand, the command is skipped, and format-json-ignored runs oxfmt in its
# place, told not to fail on an all-ignored set. format-markdown sets no
# exclude upstream, so one takes here.
[pre-commit.commands.format-markdown]
exclude = ["charts/kritika/README.md", "docs/**"]

[pre-commit.commands.format-json]
skip = true

[pre-commit.commands.format-json-ignored]
glob = ["*.json", "*.json5", "*.jsonc"]
exclude = [".mise/locks/**"]
run = "oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

# build/tools is a mise config root of its own, outside the shared format-mise
# and mise-lock globs. Its fmt and lock run as a piped group: mise fmt rewrites
# the config in place on every run, and a mise lock that reads it mid-rewrite
# prunes every tool from build/tools/mise.lock.
[[pre-commit.jobs]]
glob = "build/tools/mise.toml"

[pre-commit.jobs.group]
piped = true

[[pre-commit.jobs.group.jobs]]
name = "mise-build-tools-fmt"
run = "mise -C build/tools fmt"
stage_fixed = true

[[pre-commit.jobs.group.jobs]]
name = "mise-build-tools-lock"
run = "mise -C build/tools lock && git add build/tools/mise.lock"

[pre-commit.commands.golangci-lint]
glob = "*.go"
run = "mise exec -- golangci-lint run"

[pre-commit.commands.tidy]
glob = "go.{mod,sum}"
run = "mise exec -- go mod tidy"
stage_fixed = true

[pre-push.commands.test]
run = "mise run test"

# The bench harness sits behind the `bench` tag, so `mise run test` never
# compiles it; `-run=^$` builds it without starting the live-model eval.
[pre-push.commands.bench-compile]
run = "mise exec -- go test -tags bench -run=^$ ./bench/"
