# mise is the single source of truth for the Go toolchain (and project tools)
# across developer shells, CI, and the container build. The `go` version here
# is the toolchain that builds and tests; go.mod's `go` directive is pinned to
# the lowest patch of the same minor and is expected to lag behind (see
# AGENTS.md). The Dockerfile and release workflow read `tools.go` with
# `mise config get tools.go`.
#
# `mise tasks` lists tasks; `mise run <task>` runs one.

# The oldest mise working here takes.
min_version = "2026.10.13"

[tools]
actionlint = "1.7.12"
cosign = "3.1.4"
go = "1.27.3"
helm = "4.3.1"
helm-docs = "1.14.2"
"aqua:dadav/helm-schema" = "0.24.0"
"github:grafana/dashboard-linter" = "v0.4.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
node = "26.12.1"
oxfmt = "0.74.0"
pnpm = "12.15.0"
shellcheck = "0.11.0"
yq = "4.54.1"
zizmor = "1.31.1"

[tasks.build]
description = "Compile the binary (and the whole module)"
run = "packages=$(scripts/go-packages.sh) && go build $packages"

[tasks.vet]
description = "Run go vet, including the integration and bench build-tagged files"
run = "packages=$(scripts/go-packages.sh -tags integration,bench) && go vet -tags integration,bench $packages"

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "packages=$(scripts/go-packages.sh) && govulncheck $packages"

[tasks.test]
description = "Run the unit test suite with the race detector and coverage; arguments go to go test, and name packages to narrow it (mise run test -- ./internal/worker/)"
depends = ["fmt-check", "vet"]
run = """
# mise appends the arguments to the last line. Every package unless one is
# named: a package starts with "." or has a "/", a flag's value has neither.
unit() {
  pkgs=$(scripts/go-packages.sh) || return
  for a in "$@"; do case $a in -*) ;; .*|*/*) pkgs=;; esac; done
  go test -race $pkgs "$@" -coverprofile cover.out
}
unit
"""

[tasks.fmt]
description = "Format the code in place"
run = "packages=$(scripts/go-packages.sh) && go fmt $packages"

[tasks.fmt-check]
description = "Verify formatting without changing files (CI gate)"
run = """
unformatted=$(git ls-files --cached --others --exclude-standard -z -- '*.go' | xargs -0 gofmt -l)
test -z "$unformatted" || { printf '%s\\n' "$unformatted"; exit 1; }
"""

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint-fix]
description = "Run golangci-lint with --fix"
run = "golangci-lint run --fix"

[tasks.tidy-check]
description = "Fail if go.mod/go.sum are not tidy (CI gate)"
run = """
go mod tidy
git diff --exit-code go.mod go.sum
"""

[tasks.test-integration]
description = "Run the Postgres integration suite against a throwaway VectorChord container with the three kritika roles"
run = """
set -e
cid=$(docker run -d --rm -e POSTGRES_PASSWORD=super -p 127.0.0.1::5432 ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1 -c shared_preload_libraries=vchord)
trap 'docker stop "$cid" >/dev/null' EXIT
port=$(docker port "$cid" 5432/tcp | head -1 | sed 's/.*://')
for i in $(seq 1 30); do docker exec "$cid" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break; sleep 1; done
docker exec "$cid" psql -U postgres -v ON_ERROR_STOP=1 -q -c "CREATE ROLE kritika LOGIN PASSWORD 'owner'" -c "CREATE ROLE kritika_app LOGIN PASSWORD 'app'" -c "CREATE ROLE kritika_runner LOGIN PASSWORD 'runner'" -c "CREATE DATABASE kritika OWNER kritika"
docker exec "$cid" psql -U postgres -d kritika -v ON_ERROR_STOP=1 -q -c "CREATE EXTENSION vchord CASCADE" -c "GRANT ALL ON SCHEMA public TO kritika" -c "GRANT USAGE ON SCHEMA public TO kritika_app, kritika_runner"
export KRITIKA_TEST_SUPER_URL="postgres://postgres:super@127.0.0.1:${port}/kritika?sslmode=disable"
export KRITIKA_TEST_OWNER_URL="postgres://kritika:owner@127.0.0.1:${port}/kritika?sslmode=disable"
export KRITIKA_TEST_APP_URL="postgres://kritika_app:app@127.0.0.1:${port}/kritika?sslmode=disable"
export KRITIKA_TEST_RUNNER_URL="postgres://kritika_runner:runner@127.0.0.1:${port}/kritika?sslmode=disable"
# Only the packages with integration tests: the rest are the unit suite over
# again, uncached. -p 1: every integration package shares the one database,
# so packages must not run concurrently.
pkgs=$(grep -rl --include='*_test.go' '^//go:build integration' . | xargs -n1 dirname | sort -u)
go test -race -tags integration -count=1 -p 1 $pkgs "$@"
"""

[tasks.test-s3]
description = "Run gateway cache compatibility tests against KRITIKA_TEST_S3_ENDPOINT (see the Development docs page)"
run = "go test -race -tags integration -run '^TestS3Integration$' -count=1 -v ./internal/egress/"

[tasks.smoke]
description = "Boot kritika serve with two replicas in a throwaway kind cluster against a CloudNativePG Postgres with VectorChord, as the chart deploys it, and check readiness, helm test, one leader and the applied configuration (needs docker, kind, kubectl and helm)"
run = "scripts/smoke.sh"

[tasks.bench]
description = "Run the evaluation harness against a live model (OPENROUTER_API_KEY; KRITIKA_BENCH_DRY=1 runs it without model calls)"
run = "go test -tags bench -run TestBench -v -count=1 -timeout 60m ./bench/"

[tasks.bench-mine]
description = "Rebuild the corpus from the sibling flate and konflate checkouts' history"
run = """
go run -tags bench ./bench/cmd/mine -repo ../flate -name home-operations/flate -out bench/cases/flate.yaml
go run -tags bench ./bench/cmd/mine -repo ../konflate -name home-operations/konflate -out bench/cases/konflate.yaml
"""

[tasks.helm-lint]
description = "Lint the Helm chart"
run = "helm lint charts/kritika --values charts/kritika/ci/lint-values.yaml"

[tasks.dashboard-lint]
description = "Lint the chart's Grafana dashboards with grafana/dashboard-linter; exclusions live in charts/kritika/dashboards/.lint"
run = "for f in charts/kritika/dashboards/*.json; do dashboard-linter lint --strict \"$f\"; done"

[tasks.helm-unittest]
description = "Run helm-unittest template tests (needs the helm-unittest plugin)"
run = "helm unittest charts/kritika"

[tasks.helm-template]
description = "Render the Helm chart with the lint values"
run = "helm template kritika charts/kritika --values charts/kritika/ci/lint-values.yaml"

# The trusted root follows Sigstore's TUF repository rather than a pin, so
# generate-check leaves it out: it changes when Sigstore's keys do, and the
# Renovate regeneration workflow refreshes it with every bump.
[tasks.generate]
description = "Regenerate the chart's README and values.schema.json, and fetch Sigstore's trusted root"
run = [
  "scripts/generate-chart.sh",
  "go run ./scripts/trustedroot internal/aqua/trusted_root.json",
]

[tasks.generate-check]
description = "Fail if the generated chart README or schema is stale (CI gate)"
run = """
mise run generate
git diff --exit-code charts/kritika/README.md charts/kritika/values.schema.json
"""

[tasks.dev]
description = "Run kritika serve locally"
run = "go run ./cmd/kritika serve"

# --- Cluster development loop -------------------------------------------
# Everything cluster-specific lives in the gitignored .private/ folder: the
# kustomization (.private/deploy), the KUBECONFIG pointer
# (.private/mise.local.toml, symlinked from the repo root as .mise.local.toml;
# a local file inside .mise/ would make `mise lock` prune this file's lock)
# and the last pushed image references (.private/image and
# .private/runner-image). KRITIKA_DEV_REGISTRY, set in the same file, names a
# registry the cluster pulls from to push to instead of ttl.sh.

[tasks.image-push]
description = "Build the image and its -tools runner image and push both to KRITIKA_DEV_REGISTRY, or to ttl.sh (24h TTL) when unset, under a fresh name; the references land in .private/image and .private/runner-image"
run = """
set -e
suffix="$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
if [ -n "${KRITIKA_DEV_REGISTRY:-}" ]; then
  image="$KRITIKA_DEV_REGISTRY/kritika:dev-$suffix"
  runner="$KRITIKA_DEV_REGISTRY/kritika:dev-$suffix-tools"
else
  # ttl.sh takes the TTL as the tag.
  image="ttl.sh/kritika-$(id -un)-$suffix:24h"
  runner="ttl.sh/kritika-$(id -un)-$suffix-tools:24h"
fi
build() {
  docker build --build-arg GO_VERSION="$(mise config get -f .mise/config.toml tools.go)" --build-arg NODE_VERSION="$(mise config get -f .mise/config.toml tools.node)" --build-arg PNPM_VERSION="$(mise config get -f .mise/config.toml tools.pnpm)" --build-arg VERSION=dev --build-arg REVISION="$(git rev-parse --short HEAD 2>/dev/null || echo local)" "$@" .
}
build -t "$image"
build --target tools -t "$runner"
docker push "$image"
docker push "$runner"
mkdir -p .private
echo "$image" > .private/image
echo "$runner" > .private/runner-image
echo "pushed $image and $runner"
"""

[tasks.deploy]
description = "Push fresh images, apply .private/deploy (namespace, database, secrets) and install the chart into kritika"
depends = ["image-push"]
run = """
set -e
: "${KUBECONFIG:?set KUBECONFIG to the target cluster (see .private/mise.local.toml)}"
image="$(cat .private/image)"
runner="$(cat .private/runner-image)"
kubectl apply --server-side --field-manager kritika-dev -k .private/deploy
# Split at the last colon: a registry host may carry a port.
helm upgrade --install kritika charts/kritika -n kritika --values .private/values.yaml \
  --set image.repository="${image%:*}" --set image.tag="${image##*:}" \
  --set 'runner.podTemplate.spec.containers[0].name=runner' --set "runner.podTemplate.spec.containers[0].image=$runner" \
  --wait --timeout 10m
"""

[tasks.undeploy]
description = "Uninstall the chart and delete everything .private/deploy created, database and namespace included"
run = """
: "${KUBECONFIG:?set KUBECONFIG to the target cluster (see .private/mise.local.toml)}"
helm uninstall kritika -n kritika --ignore-not-found --wait 2>/dev/null || true
kubectl delete -k .private/deploy --ignore-not-found --wait=true
"""

[tasks.logs]
description = "Follow the kritika deployment's logs in the cluster"
run = """
: "${KUBECONFIG:?set KUBECONFIG to the target cluster (see .private/mise.local.toml)}"
kubectl -n kritika logs deployment/kritika --follow
"""

[tasks.ui-install]
description = "Install the dashboard UI's dependencies from its lockfile (pnpm)"
dir = "internal/web"
run = "pnpm install --frozen-lockfile"

[tasks.ui-lint]
description = "Lint the dashboard UI (oxlint)"
dir = "internal/web"
run = "pnpm run lint"

[tasks.ui-typecheck]
description = "Type-check the dashboard UI (svelte-check)"
dir = "internal/web"
run = "pnpm run typecheck"

[tasks.ui-build]
description = "Build the dashboard UI into internal/web/dist for go:embed"
dir = "internal/web"
run = "pnpm run build"

[tasks.ui-mock]
description = "Build the dashboard and serve it on http://localhost:5544 against mocked API data (the Playwright goldens), for reviewing UI work without a backend; `mise watch ui-mock -r` rebuilds and restarts it on every source change"
dir = "internal/web"
sources = [
  "../webapi/testdata/*.golden.json",
  "src/**/*",
  "tests/golden.ts",
  "tests/mock-server.ts",
]
run = ["pnpm exec vite build --outDir dist-mock", "node tests/mock-server.ts"]

[tasks.ui-test]
description = "Run the dashboard UI's Playwright end-to-end tests"
dir = "internal/web"
run = "pnpm run test:e2e"

[tasks.ui-test-container]
description = "Run the dashboard UI's Playwright suite inside Microsoft's pinned official Playwright image, for hosts (e.g. NixOS) that lack the system libraries Chromium needs to run outside a container"
run = """
version="$(node -p "require('./internal/web/node_modules/@playwright/test/package.json').version")"
docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work -w /work/internal/web -e CI=1 "mcr.microsoft.com/playwright:v${version}-noble" npx playwright test
"""

[hooks]
postinstall = "lefthook install"

[tasks.docs]
description = "Build the docs site (Astro Starlight) into site/, failing on a broken internal link"
dir = "docs"
run = ["pnpm install --frozen-lockfile", "pnpm run build"]

[tasks.docs-serve]
description = "Serve the docs locally with live reload"
dir = "docs"
run = ["pnpm install --frozen-lockfile", "pnpm run dev"]
