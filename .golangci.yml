version: "2"
run:
  allow-parallel-runners: true
  # Without this the build-tagged integration suite is invisible to CI (nothing
  # else compiles it), and it silently rots against internal/ API changes.
  build-tags:
    - integration
    - bench
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - modernize
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      ignore-tests: true
    gocyclo:
      min-complexity: 30
    lll:
      line-length: 140
    misspell:
      # GitLab's API spells a thing a note is on so.
      ignore-rules:
        - noteable
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
        # A ratchet: set to the longest non-test, non-generated file when it
        # was introduced, and only ever lowered.
        - name: file-length-limit
          arguments:
            - max: 800
              skipComments: false
              skipBlankLines: false
  exclusions:
    generated: lax
    rules:
      # Tests favour readability over the stricter prod rules.
      - path: (.+)_test.go
        linters:
          - goconst
          - dupl
          - lll
      - path: (.+)_test.go
        linters:
          - revive
        text: file-length-limit
    paths:
      - (^|/)node_modules/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - (^|/)node_modules/
      - third_party$
      - builtin$
      - examples$
